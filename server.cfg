endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# F008. OneSync infinity, population off, lockdown, state bags, control filter.
onesync on
set onesync_enableInfinity true
set onesync_population false
set onesync_forceMigration true
sv_maxclients 200
sv_entityLockdown strict
setr sv_stateBagStrictMode true
sv_filterRequestControl 4
sv_enforceGameBuild 3570
sv_endpointPrivacy true

ensure [maps]
ensure oxmysql
ensure ox_lib
ensure discord
ensure chat

sets tags "scavenge, survival, survive, survivor"

sets locale "en-GB"

# Set an optional server info and connecting banner image url.
# Size doesn't matter, any banner sized image will be fine.
#sets banner_detail "https://url.to/image.png"
#sets banner_connecting "https://url.to/image.png"

# Loading a server icon (96x96 PNG file)
load_server_icon logo.png

add_ace group.admin command allow # allow all commands
# add_ace group.admin command.quit deny # but don't allow quit
add_principal identifier.discord:159298655361171456 group.admin

set discord_invite_url "https://discord.gg/9FwKJMykdK"

exec env.cfg

# F001. Gamemode start order. dev is not started. oxmysql stays above this.
exec resources.cfg
